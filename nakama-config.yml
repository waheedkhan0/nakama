name: punchline-politics-server
data_dir: /nakama/data

logger:
  level: info
  stdout: true

session:
  token_expiry_sec: 2592000

matchmaker:
  interval_sec: 1
  max_tickets: 100

socket:
  server_key: defaultkey
  max_message_size_bytes: 4096
  max_request_size_bytes: 4096
  idle_timeout_min: 5

runtime:
  js_entrypoint: modules/main.js
  http_key: defaultkey

console:
  # Console is available internally; do not expose publicly.
  # Access via docker exec or port-forward when needed.
  port: 7351
