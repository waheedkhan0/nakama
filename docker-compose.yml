name: nakama-server

services:
  cockroachdb:
    image: 'cockroachdb/cockroach:v24.1.4'
    command: start-single-node --insecure --store=attrs=ssd,path=/var/lib/cockroach/
    restart: unless-stopped
    volumes:
      - cockroach-data:/var/lib/cockroach
    expose:
      - "8080"
      - "26257"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    entrypoint:
      - /bin/sh
      - -ecx
      - |
        /nakama/nakama migrate up --database.address root@cockroachdb:26257 &&
        exec /nakama/nakama \
          --name nakama1 \
          --data_dir /nakama/data \
          --database.address root@cockroachdb:26257 \
          --logger.level WARN \
          --metrics.prometheus_port 9100 \
          --matchmaker.interval_sec 1 \
          --matchmaker.max_tickets 100 \
          --socket.max_message_size_bytes 4096 \
          --socket.max_request_size_bytes 4096 \
          --socket.idle_timeout_min 5 \
          --runtime.http_key "${NAKAMA_HTTP_KEY}" \
          --runtime.js_entrypoint "modules/main.js" \
          --console.username "${NAKAMA_CONSOLE_USERNAME}" \
          --console.password "${NAKAMA_CONSOLE_PASSWORD}" \
          --console.signing_key "${NAKAMA_CONSOLE_SIGNING_KEY}" \
          --socket.server_key "${NAKAMA_SOCKET_SERVER_KEY}" \
          --session.encryption_key "${NAKAMA_SESSION_ENCRYPTION_KEY}" \
          --session.refresh_encryption_key "${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY}"
    restart: unless-stopped
    depends_on:
      cockroachdb:
        condition: service_healthy
      prometheus:
        condition: service_started
    volumes:
      - ./:/nakama/data
    expose:
      - "7349"
      - "7350"
      - "7351"
      - "9100"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    environment:
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY}
      - NAKAMA_CONSOLE_USERNAME=${NAKAMA_CONSOLE_USERNAME}
      - NAKAMA_CONSOLE_PASSWORD=${NAKAMA_CONSOLE_PASSWORD}
      - NAKAMA_CONSOLE_SIGNING_KEY=${NAKAMA_CONSOLE_SIGNING_KEY}
      - NAKAMA_SOCKET_SERVER_KEY=${NAKAMA_SOCKET_SERVER_KEY}
      - NAKAMA_SESSION_ENCRYPTION_KEY=${NAKAMA_SESSION_ENCRYPTION_KEY}
      - NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY=${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  prometheus:
    image: prom/prometheus:v3.0.0
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/prometheus/prometheus.yml <<EOF
        global:
          scrape_interval: 15s
          evaluation_interval: 15s
        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ['localhost:9090']
          - job_name: nakama
            metrics_path: /
            static_configs:
              - targets: ['nakama:9100']
        EOF
        /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=15d \
          --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cockroach-data:
  prometheus-data: