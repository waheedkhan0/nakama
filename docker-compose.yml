name: nakama-server

services:
  cockroachdb:
    image: 'cockroachdb/cockroach:v24.1.4'
    command: start-single-node --insecure --store=attrs=ssd,path=/var/lib/cockroach/
    restart: unless-stopped
    volumes:
      - cockroach-data:/var/lib/cockroach
    expose:
      - "8080"
      - "26257"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    entrypoint:
      - /bin/sh
      - -ecx
      - |
        mkdir -p /nakama/data/modules
        cat > /nakama/data/modules/main.js <<'JSEOF'
        var InitModule = function (ctx, logger, nk, initializer) {
          logger.info('Punch-Line Politics server module loaded');
          initializer.registerMatch('punchline_match', {
            matchInit: matchInit,
            matchJoinAttempt: matchJoinAttempt,
            matchJoin: matchJoin,
            matchLeave: matchLeave,
            matchLoop: matchLoop,
            matchTerminate: matchTerminate,
          });
          initializer.registerRpc('get_leaderboard', getLeaderboard);
          initializer.registerRpc('report_match_result', reportMatchResult);
          initializer.registerRpc('update_player_mmr', updatePlayerMmr);
        };
        var matchInit = function (ctx, logger, nk, params) {
          var state = { players: {}, round: 0, startTime: Date.now(), preset: (params && params.mode) ? params.mode : 'casual' };
          return { state: state, tickRate: 30, label: 'Punch-Line Match' };
        };
        var matchJoinAttempt = function (ctx, logger, nk, dispatcher, tick, state, presence, metadata) {
          return { state: state, accept: true };
        };
        var matchJoin = function (ctx, logger, nk, dispatcher, tick, state, presences) {
          for (var i = 0; i < presences.length; i++) { state.players[presences[i].userId] = presences[i]; }
          return { state: state };
        };
        var matchLeave = function (ctx, logger, nk, dispatcher, tick, state, presences) {
          for (var i = 0; i < presences.length; i++) { delete state.players[presences[i].userId]; }
          return { state: state };
        };
        var matchLoop = function (ctx, logger, nk, dispatcher, tick, state, messages) {
          for (var i = 0; i < messages.length; i++) { dispatcher.broadcastMessage(messages[i].opCode, messages[i].data, null, false); }
          return { state: state };
        };
        var matchTerminate = function (ctx, logger, nk, dispatcher, tick, state, graceSeconds) {
          return { state: state };
        };
        var getLeaderboard = function (ctx, logger, nk, payload) {
          try { return JSON.stringify(nk.leaderboardRecordsList('mmr_global', null, 100, null, null)); }
          catch (err) { return JSON.stringify({ error: err.message }); }
        };
        var reportMatchResult = function (ctx, logger, nk, payload) {
          try {
            var data = JSON.parse(payload);
            nk.leaderboardRecordWrite('mmr_global', data.winnerId, '', data.winnerMmr || 0, 0);
            nk.leaderboardRecordWrite('mmr_global', data.loserId, '', data.loserMmr || 0, 0);
            nk.storageWrite([
              { collection: 'player_data', key: 'stats', userId: data.winnerId, value: { coins: data.winnerCoins ? String(data.winnerCoins) : '0', mmr: String(data.winnerMmr || 0) }, permissionRead: 2, permissionWrite: 1 },
              { collection: 'player_data', key: 'stats', userId: data.loserId, value: { coins: data.loserCoins ? String(data.loserCoins) : '0', mmr: String(data.loserMmr || 0) }, permissionRead: 2, permissionWrite: 1 },
            ]);
            return JSON.stringify({ success: true });
          } catch (err) { return JSON.stringify({ error: err.message }); }
        };
        var updatePlayerMmr = function (ctx, logger, nk, payload) {
          try { var data = JSON.parse(payload); nk.leaderboardRecordWrite('mmr_global', data.userId, '', data.mmr || 0, 0); return JSON.stringify({ success: true, mmr: data.mmr }); }
          catch (err) { return JSON.stringify({ error: err.message }); }
        };
        JSEOF
        cat > /nakama/data/nakama-config.yml <<'CONFIGEOF'
        name: punchline-politics-server
        data_dir: /nakama/data
        logger:
          level: info
          stdout: true
        session:
          token_expiry_sec: 2592000
        matchmaker:
          interval_sec: 1
          max_tickets: 100
        socket:
          server_key: defaultkey
          max_message_size_bytes: 4096
          max_request_size_bytes: 262144
          idle_timeout_ms: 300000
        runtime:
          js_entrypoint: main.js
          http_key: defaultkey
        console:
          port: 7351
        CONFIGEOF
        /nakama/nakama migrate up --database.address root@cockroachdb:26257 &&
        exec /nakama/nakama \
          --name nakama1 \
          --config /nakama/data/nakama-config.yml \
          --database.address root@cockroachdb:26257 \
          --logger.level WARN \
          --metrics.prometheus_port 9100 \
          --runtime.http_key "${NAKAMA_HTTP_KEY}" \
          --console.username "${NAKAMA_CONSOLE_USERNAME}" \
          --console.password "${NAKAMA_CONSOLE_PASSWORD}" \
          --console.signing_key "${NAKAMA_CONSOLE_SIGNING_KEY}" \
          --socket.server_key "${NAKAMA_SOCKET_SERVER_KEY}" \
          --session.encryption_key "${NAKAMA_SESSION_ENCRYPTION_KEY}" \
          --session.refresh_encryption_key "${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY}"
    restart: unless-stopped
    depends_on:
      cockroachdb:
        condition: service_healthy
      prometheus:
        condition: service_started
    volumes:
      - ./:/nakama/data
    expose:
      - "7349"
      - "7350"
      - "7351"
      - "9100"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    environment:
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY}
      - NAKAMA_CONSOLE_USERNAME=${NAKAMA_CONSOLE_USERNAME}
      - NAKAMA_CONSOLE_PASSWORD=${NAKAMA_CONSOLE_PASSWORD}
      - NAKAMA_CONSOLE_SIGNING_KEY=${NAKAMA_CONSOLE_SIGNING_KEY}
      - NAKAMA_SOCKET_SERVER_KEY=${NAKAMA_SOCKET_SERVER_KEY}
      - NAKAMA_SESSION_ENCRYPTION_KEY=${NAKAMA_SESSION_ENCRYPTION_KEY}
      - NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY=${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  prometheus:
    image: prom/prometheus:v3.0.0
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/prometheus/prometheus.yml <<EOF
        global:
          scrape_interval: 15s
          evaluation_interval: 15s
        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ['localhost:9090']
          - job_name: nakama
            metrics_path: /
            static_configs:
              - targets: ['nakama:9100']
        EOF
        /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=15d \
          --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cockroach-data:
  prometheus-data: